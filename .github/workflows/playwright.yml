name: Quality gate

# CI runs the static checks only. The test suites run against the live KPost application from the
# QA machine, where the credentials and the shared-server safety rules live (docs/guides/commands.md) —
# they are not something a hosted runner should drive on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Tag governance is its OWN step and runs even when `npm run check` fails (`!cancelled()`), so a
      # formatting failure never masks a tag violation. Lists tests via `playwright --list` (no server
      # contact, no live creds — env defaults suffice), so it is safe on a hosted runner. Live test
      # suites deliberately do NOT run in CI; they run from the QA machine (see docs/TEST-RUN-LEVELS.md).
      - name: Tag governance (lint:tags)
        if: ${{ !cancelled() }}
        run: npm run lint:tags
